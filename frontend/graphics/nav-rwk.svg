<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Kurspeilung zur Tonne 5</title>
  <desc id="desc">Kompassrose mit Kurslinie von der Startposition zur Tonne 5. Der rechtweisende Kurs wird an der Gradeinteilung abgelesen.</desc>
  <rect width="720" height="360" fill="#f7f4e9"/>
  <g stroke="#d2c8b3" stroke-width="1">
    <path d="M0 60h720M0 120h720M0 180h720M0 240h720M0 300h720"/>
    <path d="M120 0v360M240 0v360M360 0v360M480 0v360M600 0v360"/>
  </g>
  <text x="36" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#10212b">rwK ablesen</text>
  <!-- compass rose centre 260,180 -->
  <circle cx="260" cy="180" r="130" fill="#ffffff" stroke="#10212b" stroke-width="3"/>
  <circle cx="260" cy="180" r="112" fill="none" stroke="#d2c8b3" stroke-width="1"/>
  <g stroke="#10212b" stroke-width="2">
    <path d="M260 50V68"/><path d="M325 67.4L316 82.9"/><path d="M372.6 115L357 124"/>
    <path d="M390 180H372"/><path d="M372.6 245L357 236"/><path d="M325 292.6L316 277"/>
    <path d="M260 310V292"/><path d="M195 292.6L204 277"/><path d="M147.4 245L163 236"/>
    <path d="M130 180H148"/><path d="M147.4 115L163 124"/><path d="M195 67.4L204 82.9"/>
  </g>
  <g font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#10212b" text-anchor="middle">
    <text x="260" y="32">N</text><text x="338" y="52">030</text><text x="396" y="108">060</text>
    <text x="416" y="185">O</text><text x="396" y="260">120</text><text x="338" y="316">150</text>
    <text x="260" y="336">S</text><text x="182" y="316">210</text><text x="124" y="260">240</text>
    <text x="104" y="185">W</text><text x="124" y="108">300</text><text x="182" y="52">330</text>
  </g>
  <!-- course line at 148 deg -->
  <g fill="none" stroke="#d63f2f" stroke-width="4" stroke-linecap="round">
    <path d="M260 180L328 288"/>
  </g>
  <circle cx="260" cy="180" r="7" fill="#006c75" stroke="#10212b" stroke-width="2"/>
  <rect x="320" y="282" width="22" height="30" rx="3" fill="#d63f2f" stroke="#10212b" stroke-width="2"/>
  <!-- info panel -->
  <g>
    <rect x="430" y="92" width="256" height="120" rx="10" fill="#ffffff" stroke="#10212b" stroke-width="2"/>
    <g font-family="Segoe UI, sans-serif" fill="#10212b">
      <text x="448" y="124" font-size="16" font-weight="700">Gegeben</text>
      <text x="448" y="156" font-size="15">Standort: 53&#176;54,2&#39;N</text>
      <text x="448" y="178" font-size="15">007&#176;53,8&#39;E</text>
      <text x="448" y="202" font-size="15">Ziel: Tonne &#8222;5&#8220; Neue Weser</text>
    </g>
  </g>
  <text x="346" y="306" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#10212b">Tonne &#8222;5&#8220;</text>
  <text x="200" y="176" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#006c75">Standort</text>
</svg>
