<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Kursumrechnung rechtweisend zu magnetisch</title>
  <desc id="desc">Gegebene Werte fuer die Umrechnung von rechtweisendem Kurs in Magnetkompasskurs: rechtweisender Kurs, Missweisung und Ablenkung.</desc>
  <rect width="720" height="360" fill="#f7f4e9"/>
  <g stroke="#d2c8b3" stroke-width="1">
    <path d="M0 60h720M0 120h720M0 180h720M0 240h720M0 300h720"/>
    <path d="M120 0v360M240 0v360M360 0v360M480 0v360M600 0v360"/>
  </g>
  <g font-family="Segoe UI, sans-serif" font-weight="700" fill="#10212b">
    <text x="36" y="40" font-size="24">Umrechnung rwK &#8594; MgK</text>
  </g>
  <!-- compass rose -->
  <g transform="translate(170 200)">
    <circle r="110" fill="#ffffff" stroke="#10212b" stroke-width="3"/>
    <circle r="84" fill="none" stroke="#d2c8b3" stroke-width="1"/>
    <g stroke="#10212b" stroke-width="2">
      <path d="M0 -110V-92"/><path d="M0 110V92"/><path d="M-110 0H-92"/><path d="M110 0H92"/>
    </g>
    <g font-family="Segoe UI, sans-serif" font-weight="700" fill="#10212b" font-size="16" text-anchor="middle">
      <text x="0" y="-72">N</text><text x="76" y="6">O</text><text x="0" y="86">S</text><text x="-76" y="6">W</text>
    </g>
    <!-- rwK 206 degrees: down-left -->
    <g stroke="#d63f2f" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M0 0L-39 88"/>
    </g>
    <path d="M-39 88l-2-26 22 12z" fill="#d63f2f"/>
    <circle r="6" fill="#10212b"/>
  </g>
  <!-- data panel -->
  <g>
    <rect x="340" y="92" width="344" height="200" rx="10" fill="#ffffff" stroke="#10212b" stroke-width="2"/>
    <g font-family="Segoe UI, sans-serif" fill="#10212b">
      <text x="360" y="126" font-size="16" font-weight="700">Gegebene Werte</text>
      <text x="360" y="162" font-size="18">rechtweisender Kurs (rwK): 206&#176;</text>
      <text x="360" y="196" font-size="18">Missweisung (Mw): 0&#176;</text>
      <text x="360" y="230" font-size="18">Ablenkung (Abl): +4&#176;</text>
      <line x1="360" y1="246" x2="664" y2="246" stroke="#d2c8b3" stroke-width="1"/>
      <text x="360" y="276" font-size="16" fill="#5a6b73">MgK = rwK &#8722; Mw &#8722; Abl</text>
    </g>
  </g>
</svg>
