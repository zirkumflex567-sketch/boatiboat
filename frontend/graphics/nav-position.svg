<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Seekartenausschnitt mit Tonne A10</title>
  <desc id="desc">Gitter mit Breiten- und Laengenangaben. Die Tonne A10 ist eingezeichnet, ihre Position wird an den Gitterlinien abgelesen.</desc>
  <rect width="720" height="360" fill="#f7f4e9"/>
  <rect x="90" y="20" width="600" height="300" fill="#eef6f2" stroke="#10212b" stroke-width="2"/>
  <!-- minor grid -->
  <g stroke="#d2c8b3" stroke-width="1">
    <path d="M190 20v300M390 20v300M590 20v300"/>
    <path d="M90 70h600M90 170h600M90 270h600"/>
  </g>
  <!-- major grid -->
  <g stroke="#9bb0a6" stroke-width="1.5">
    <path d="M290 20v300M490 20v300"/>
    <path d="M90 120h600M90 220h600"/>
  </g>
  <!-- longitude labels (bottom) -->
  <g font-family="Segoe UI, sans-serif" font-size="13" fill="#10212b" text-anchor="middle">
    <text x="90" y="338">008&#176;04&#39;</text>
    <text x="290" y="338">008&#176;06&#39;</text>
    <text x="490" y="338">008&#176;08&#39;</text>
    <text x="690" y="338">008&#176;10&#39;</text>
  </g>
  <!-- latitude labels (left) -->
  <g font-family="Segoe UI, sans-serif" font-size="13" fill="#10212b" text-anchor="end">
    <text x="82" y="25">53&#176;56&#39;N</text>
    <text x="82" y="125">53&#176;54&#39;N</text>
    <text x="82" y="225">53&#176;52&#39;N</text>
    <text x="82" y="325">53&#176;50&#39;N</text>
  </g>
  <!-- buoy A10 at long 008 06,4' (x=330) lat 53 52,6' (y=190) -->
  <g>
    <path d="M330 190l-7 -18 14 0z" fill="#d63f2f" stroke="#10212b" stroke-width="2"/>
    <circle cx="330" cy="190" r="4" fill="#10212b"/>
    <text x="340" y="186" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#10212b">A10</text>
  </g>
  <text x="36" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#10212b">Position ablesen</text>
</svg>
