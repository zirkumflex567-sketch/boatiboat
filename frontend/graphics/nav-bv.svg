<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Besteckversetzung zwischen Koppelort und beobachtetem Ort</title>
  <desc id="desc">Koppelort und durch Peilung der Tonne ST bestimmter beobachteter Ort. Die Besteckversetzung ist der Vektor vom Koppelort zum beobachteten Ort.</desc>
  <rect width="720" height="360" fill="#f7f4e9"/>
  <g stroke="#d2c8b3" stroke-width="1">
    <path d="M0 60h720M0 120h720M0 180h720M0 240h720M0 300h720"/>
    <path d="M120 0v360M240 0v360M360 0v360M480 0v360M600 0v360"/>
  </g>
  <text x="36" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#10212b">Besteckversetzung bestimmen</text>
  <!-- north arrow -->
  <g transform="translate(70 120)">
    <path d="M0 28V-22" stroke="#10212b" stroke-width="3"/>
    <path d="M0 -30l-7 16h14z" fill="#10212b"/>
    <text x="-6" y="48" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#10212b">N</text>
  </g>
  <!-- peiling line Fix -> ST -->
  <path d="M300 140L322 300" stroke="#10212b" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- Tonne ST -->
  <rect x="311" y="300" width="22" height="30" rx="3" fill="#d63f2f" stroke="#10212b" stroke-width="2"/>
  <text x="338" y="320" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#10212b">Tonne &#8222;ST&#8220;</text>
  <text x="318" y="240" font-family="Segoe UI, sans-serif" font-size="13" fill="#10212b" transform="rotate(8 318 240)">rwP 168&#176; &#183; 2,0 sm</text>
  <!-- BV vector Koppel -> Fix -->
  <g fill="none" stroke="#006c75" stroke-width="4" stroke-linecap="round">
    <path d="M360 182L306 146"/>
  </g>
  <path d="M300 142l16 2-7 13z" fill="#006c75"/>
  <!-- Koppelort -->
  <circle cx="360" cy="182" r="7" fill="#ffffff" stroke="#10212b" stroke-width="3"/>
  <text x="372" y="186" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#10212b">Koppelort</text>
  <!-- beobachteter Ort -->
  <circle cx="300" cy="140" r="8" fill="#006c75" stroke="#10212b" stroke-width="3"/>
  <text x="150" y="138" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#006c75" text-anchor="end">beobachteter Ort</text>
  <!-- scale bar -->
  <g transform="translate(60 312)">
    <path d="M0 0H72" stroke="#10212b" stroke-width="3"/>
    <path d="M0 -6V6M72 -6V6" stroke="#10212b" stroke-width="3"/>
    <text x="36" y="24" font-family="Segoe UI, sans-serif" font-size="13" fill="#10212b" text-anchor="middle">1 sm</text>
  </g>
  <!-- panel -->
  <g>
    <rect x="470" y="92" width="216" height="118" rx="10" fill="#ffffff" stroke="#10212b" stroke-width="2"/>
    <g font-family="Segoe UI, sans-serif" fill="#10212b">
      <text x="488" y="124" font-size="16" font-weight="700">Gegeben (09:00 Uhr)</text>
      <text x="488" y="154" font-size="15">Peilung Tonne &#8222;ST&#8220;</text>
      <text x="488" y="176" font-size="15">rwP = 168&#176;</text>
      <text x="488" y="198" font-size="15">Distanz = 2,0 sm</text>
    </g>
  </g>
</svg>
