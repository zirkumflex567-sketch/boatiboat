<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boatiboat SBF Trainer</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">SBF Binnen & See</p>
          <h1>Verstehen statt nur ankreuzen.</h1>
          <p class="intro">
            Boatiboat fragt dich wie in der Prüfung ab, zeigt im Lernmodus aber sofort,
            warum eine Antwort stimmt. Falsche Fragen tauchen automatisch häufiger auf.
          </p>
        </div>
        <div class="instrument">
          <span id="timer">Lernmodus</span>
          <strong id="score">0 / 0</strong>
          <small>Fortschritt</small>
        </div>
      </section>

      <section class="controls" aria-label="Training konfigurieren">
        <label>
          Modus
          <select id="mode">
            <option value="learn">Lernmodus</option>
            <option value="exam">Prüfungsmodus</option>
          </select>
        </label>
        <label>
          Schein
          <select id="license">
            <option value="">Binnen + See</option>
            <option value="see">See</option>
            <option value="binnen">Binnen</option>
          </select>
        </label>
        <label>
          Fragen
          <select id="limit">
            <option>10</option>
            <option>20</option>
            <option>30</option>
          </select>
        </label>
        <button id="start">Neu starten</button>
      </section>

      <section class="trainer" aria-live="polite">
        <div class="meta">
          <span id="category">Bereit</span>
          <span id="priority">Spaced Repetition</span>
        </div>
        <h2 id="prompt">Lade die erste Session...</h2>
        <div id="choices" class="choices"></div>
        <div id="explanation" class="explanation hidden"></div>
        <div class="actions">
          <button id="next" disabled>Nächste Frage</button>
        </div>
      </section>
    </main>
    <script src="assets/app.js"></script>
  </body>
</html>
